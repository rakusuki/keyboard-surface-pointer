name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q core.py pointer.py keycodes.py windows_backend.py ubuntu_backend.py macos_backend.py
      - run: python pointer.py --help
      - if: runner.os == 'Windows'
        run: python pointer.py --check-backend
      - if: runner.os == 'Linux'
        run: python -m pip install -r requirements-ubuntu.txt
      - if: runner.os == 'macOS'
        run: python -m pip install -r requirements-macos.txt
      - if: runner.os != 'Windows'
        run: python pointer.py --check-backend
